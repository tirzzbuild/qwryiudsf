<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER PAYMENT</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#03000b;
    color:white;
    overflow-x:hidden;
}

/* BACKGROUND */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(circle at 20% 20%,#00ffff33,transparent 30%),
      radial-gradient(circle at 80% 80%,#a000ff44,transparent 30%);
    z-index:-2;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(#00ffff15 1px,transparent 1px),
      linear-gradient(90deg,#00ffff15 1px,transparent 1px);
    background-size:50px 50px;
    transform:perspective(500px) rotateX(60deg) scale(2);
    transform-origin:bottom;
    animation:gridMove 5s linear infinite;
    z-index:-1;
}

@keyframes gridMove{
    to{background-position:0 50px;}
}

/* OPENING */
#opening{
    position:fixed;
    inset:0;
    background:#020006;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:9999;
    transition:1s;
}

.opening-box{
    animation:zoom 2s infinite alternate;
}

.opening-title{
    font-size:55px;
    font-weight:bold;
    letter-spacing:8px;
    color:#fff;
    text-shadow:
      0 0 10px #00ffff,
      0 0 30px #00ffff,
      0 0 60px #a000ff;
}

.opening-sub{
    color:#00ffff;
    letter-spacing:5px;
    margin-top:15px;
}

.enter{
    margin-top:35px;
    padding:15px 45px;
    border:2px solid #00ffff;
    border-radius:30px;
    background:#00ffff11;
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 25px #00ffff;
    transition:.3s;
}

.enter:hover{
    background:#00ffff;
    color:#000;
    transform:scale(1.1);
}

@keyframes zoom{
    from{transform:scale(1)}
    to{transform:scale(1.04)}
}

/* MAIN */
#main{
    display:none;
    padding:30px 15px 100px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    text-align:center;
    margin:20px 0 40px;
}

.header h1{
    font-size:45px;
    text-shadow:
      0 0 10px #00ffff,
      0 0 30px #a000ff;
}

.header p{
    color:#aaa;
    margin-top:10px;
}

/* PAYMENT GRID */
.payment-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:25px;
}

/* 3D CARD */
.card{
    min-height:240px;
    padding:25px;
    position:relative;
    border-radius:25px;
    background:linear-gradient(
        145deg,
        rgba(0,255,255,.12),
        rgba(160,0,255,.12)
    );
    border:1px solid #00ffff66;
    backdrop-filter:blur(15px);
    transform-style:preserve-3d;
    transition:.15s;
    box-shadow:
      0 15px 40px #000,
      inset 0 0 30px #00ffff0d;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    background:#00ffff;
    filter:blur(80px);
    opacity:.2;
    right:-50px;
    top:-50px;
}

.card:hover{
    box-shadow:
      0 0 25px #00ffff66,
      0 0 50px #a000ff44;
}

.icon{
    font-size:50px;
    margin-bottom:15px;
    transform:translateZ(40px);
}

.card h2{
    transform:translateZ(30px);
}

.card p{
    color:#aaa;
    margin-top:8px;
}

.number{
    color:#00ffff;
    font-size:19px;
    margin:18px 0;
    transform:translateZ(25px);
}

.btn{
    padding:11px 22px;
    border-radius:25px;
    background:linear-gradient(90deg,#00ffff,#8a00ff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #00ffff66;
    transition:.3s;
}

.btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 30px #00ffff;
}

/* QRIS */
#qrPopup{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:#000b;
    z-index:5000;
    padding:20px;
}
